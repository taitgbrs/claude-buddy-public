[env:m5stick-c]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
; two app slots so firmware can update over WiFi (tools/ota.sh)
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
; FTDI on the Stick is unreliable above 115200
upload_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
